<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #0f172a; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .thick { stroke: #0f172a; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fill-white { fill: #ffffff; }
      .grid-line { stroke: #0f172a; stroke-width: 6; }
      .panel-reject { fill: #fee2e2; }
      .panel-approve { fill: #dcfce7; }
      .box-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #0f172a; }
      .caption-bar { fill: #0f172a; }
      .caption-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 24px; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1000" height="700" class="bg" />

  <!-- Top Caption Bar -->
  <rect x="0" y="0" width="1000" height="60" class="caption-bar" />
  <text x="500" y="38" class="caption-text">{{TOP_CAPTION}}</text>

  <!-- Dividing Grid Lines -->
  <line x1="380" y1="60" x2="380" y2="700" class="grid-line" />
  <line x1="0" y1="380" x2="1000" y2="380" class="grid-line" />

  <!-- TOP ROW: DISAPPROVAL / REJECTION -->
  <!-- Top Left: Disapproving Doodle Character -->
  <g transform="translate(190, 220)">
    <!-- Head turned away with disgust -->
    <circle cx="-10" cy="-30" r="50" class="fill-white" stroke="#0f172a" stroke-width="6" />
    <!-- Disgusted Squinting Eyes -->
    <path d="M -40,-40 L -25,-32 L -40,-24" class="line" stroke-width="5" />
    <path d="M -15,-40 L 0,-32 L -15,-24" class="line" stroke-width="5" />
    <!-- Sick/Cringe Squiggly Mouth -->
    <path d="M -35,-10 Q -20,-5 -5,-15" class="line" stroke-width="5" />
    <!-- Body -->
    <path d="M -40,20 L -60,140 L 40,140 L 20,20 Z" class="fill-white" stroke="#0f172a" stroke-width="6" />
    <!-- Hand Pushed Up in Disgust / "Nah" Gesture -->
    <path d="M 20,40 Q 70,10 75,-30" class="thick" />
    <!-- Open palm blocking the right panel -->
    <ellipse cx="78" cy="-45" rx="16" ry="24" transform="rotate(20 78 -45)" class="fill-white" stroke="#0f172a" stroke-width="5" />
    <line x1="72" y1="-65" x2="72" y2="-40" class="line" stroke-width="3" />
    <line x1="82" y1="-65" x2="82" y2="-40" class="line" stroke-width="3" />
  </g>

  <!-- Top Right: Rejected Idea Text Box -->
  <rect x="400" y="80" width="580" height="280" rx="12" class="panel-reject" stroke="#0f172a" stroke-width="4" />
  <g transform="translate(430, 160)">
    <text x="0" y="0" class="box-text">❌ {{REJECTED_IDEA}}</text>
  </g>

  <!-- BOTTOM ROW: APPROVAL / ENTHUSIASM -->
  <!-- Bottom Left: Approving / Pointing Doodle Character -->
  <g transform="translate(190, 540)">
    <!-- Smug, Happy Grinning Head -->
    <circle cx="0" cy="-30" r="50" class="fill-white" stroke="#0f172a" stroke-width="6" />
    <!-- Winking Sparkle Eyes -->
    <ellipse cx="-18" cy="-35" rx="6" ry="8" fill="#0f172a" />
    <path d="M 10,-38 Q 22,-32 30,-38" class="line" stroke-width="5" />
    <!-- Big Happy Grin -->
    <path d="M -22,-10 Q 2,15 26,-10" class="line" stroke-width="6" />
    <!-- Body -->
    <path d="M -30,20 L -50,140 L 50,140 L 30,20 Z" class="fill-white" stroke="#0f172a" stroke-width="6" />
    <!-- Finger Guns / Pointing enthusiastically to right panel -->
    <path d="M 25,40 Q 80,30 110,10" class="thick" />
    <!-- Hand pointing finger -->
    <ellipse cx="115" cy="8" rx="14" ry="12" class="fill-white" stroke="#0f172a" stroke-width="4" />
    <line x1="125" y1="5" x2="160" y2="5" class="thick" stroke-width="7" />
    <!-- Sparkle marks -->
    <path d="M 165,-10 L 175,-10" class="line" stroke="#eab308" stroke-width="3" />
    <path d="M 170,-15 L 170,-5" class="line" stroke="#eab308" stroke-width="3" />
  </g>

  <!-- Bottom Right: Approved Brilliant Idea Text Box -->
  <rect x="400" y="400" width="580" height="280" rx="12" class="panel-approve" stroke="#0f172a" stroke-width="4" />
  <g transform="translate(430, 480)">
    <text x="0" y="0" class="box-text">👉 {{APPROVED_IDEA}}</text>
  </g>
</svg>
