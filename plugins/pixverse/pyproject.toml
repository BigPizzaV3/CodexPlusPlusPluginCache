[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixverse-agent-plugin"
version = "1.3.2"
description = "Video creation skills and lightweight tooling for PixVerse, with image, audio, editing, and Canvas capabilities."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PixVerse" }]
dependencies = []

[project.optional-dependencies]
graphics = ["Pillow"]

[project.scripts]
pvx = "pvx.cli:main"

[tool.setuptools]
packages = ["pvx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
