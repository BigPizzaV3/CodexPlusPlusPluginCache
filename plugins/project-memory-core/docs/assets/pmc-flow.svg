<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How PMC gives Codex lasting project context</title>
  <desc id="desc">Four steps: set up the vault, scan the project, remember important knowledge, and resume future work with context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17182b"/>
      <stop offset="1" stop-color="#292b55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#090a18" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff">
    <text x="52" y="52" font-size="22" font-weight="700">FROM A COLD START TO LASTING CONTEXT</text>
    <text x="52" y="80" font-size="15" fill="#c6c9ef">A private, reviewable memory loop inside your Obsidian vault</text>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(45 112)">
      <rect width="245" height="140" rx="20" fill="#ffffff"/>
      <circle cx="32" cy="32" r="18" fill="#625cf6"/><text x="32" y="38" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700" fill="#fff">1</text>
      <text x="60" y="37" font-size="18" font-weight="700" fill="#17182b">Set up</text>
      <text x="24" y="76" font-size="14" fill="#4e526f">Create or connect the</text>
      <text x="24" y="98" font-size="14" fill="#4e526f">project's Obsidian vault.</text>
      <text x="24" y="122" font-size="13" font-weight="600" fill="#625cf6">One conversational prompt</text>
    </g>
    <g transform="translate(333 112)">
      <rect width="245" height="140" rx="20" fill="#ffffff"/>
      <circle cx="32" cy="32" r="18" fill="#625cf6"/><text x="32" y="38" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700" fill="#fff">2</text>
      <text x="60" y="37" font-size="18" font-weight="700" fill="#17182b">Orient</text>
      <text x="24" y="76" font-size="14" fill="#4e526f">Build a useful Project Home</text>
      <text x="24" y="98" font-size="14" fill="#4e526f">from repository evidence.</text>
      <text x="24" y="122" font-size="13" font-weight="600" fill="#625cf6">No invented project facts</text>
    </g>
    <g transform="translate(621 112)">
      <rect width="245" height="140" rx="20" fill="#ffffff"/>
      <circle cx="32" cy="32" r="18" fill="#625cf6"/><text x="32" y="38" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700" fill="#fff">3</text>
      <text x="60" y="37" font-size="18" font-weight="700" fill="#17182b">Remember</text>
      <text x="24" y="76" font-size="14" fill="#4e526f">Approve decisions, constraints,</text>
      <text x="24" y="98" font-size="14" fill="#4e526f">discoveries, and procedures.</text>
      <text x="24" y="122" font-size="13" font-weight="600" fill="#625cf6">You control durable writes</text>
    </g>
    <g transform="translate(909 112)">
      <rect width="245" height="140" rx="20" fill="#ffffff"/>
      <circle cx="32" cy="32" r="18" fill="#625cf6"/><text x="32" y="38" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700" fill="#fff">4</text>
      <text x="60" y="37" font-size="18" font-weight="700" fill="#17182b">Resume</text>
      <text x="24" y="76" font-size="14" fill="#4e526f">Future tasks load only the</text>
      <text x="24" y="98" font-size="14" fill="#4e526f">context that matters.</text>
      <text x="24" y="122" font-size="13" font-weight="600" fill="#625cf6">Less repetition, safer work</text>
    </g>
  </g>
  <g stroke="#8e8af9" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M296 182h28"/><path d="m317 174 9 8-9 8"/>
    <path d="M584 182h28"/><path d="m605 174 9 8-9 8"/>
    <path d="M872 182h28"/><path d="m893 174 9 8-9 8"/>
  </g>
</svg>
